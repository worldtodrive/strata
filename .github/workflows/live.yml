

name: live

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:


  pull_request:
    paths:
      - 'ci/features/live/**'
      - 'ci/features/support/live.steps.mjs'
      - 'ci/features/support/shared.mjs'
      - '.github/workflows/live.yml'

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test the live site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Install the test runner
        working-directory: ci
        run: npm ci

      - name: Install a browser
        working-directory: ci
        run: npx playwright install --with-deps chromium

      - name: Smoke test the live site
        working-directory: ci
        run: npm run test:live
