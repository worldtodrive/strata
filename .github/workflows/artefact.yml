

name: artefact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artefact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate the shipped artefact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          echo "Working tree:"
          ./gitleaks dir . --redact --no-banner
          echo "History:"
          ./gitleaks git . --redact --no-banner
          rm -f gitleaks

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - name: Install the test runner
        working-directory: ci
        run: npm ci

      - name: Check the artefact
        working-directory: ci
        run: npm run test:artefact
